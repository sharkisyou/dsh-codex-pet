[package]
name = "desktop-pet"
version = "0.1.0"
description = "Tauri 2 shell for the DSH desktop pet"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Threading",
] }
# focus_dsh_gui 用 UI Automation 读浏览器标签页（windows-sys 不含 UIA 接口）。
# 该 crate 本就是 tauri 的传递依赖，这里只是多开几个 API 特性。
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
] }

[profile.release]
strip = true
