[package]
name = "desktop-pet"
version = "0.1.0"
description = "Tauri 2 shell for the DSH desktop pet"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
