<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌宠</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app" class="shell">
      <!-- 桌宠窗口外壳（设置窗口下由 .shell--settings 隐藏） -->
      <section class="pet-stage" id="pet-stage">
        <div id="pet" class="pet" aria-label="桌宠"></div>
        <!-- 待机形态：精灵未加载（如服务端未连接）时的宠物剪影 + 未连接角标。
             默认带 show：首帧即显示（角标文案已内联），精灵就绪后由 JS 淡出。 -->
        <div id="pet-standby" class="pet-standby show" aria-label="桌宠待机">
          <div class="pet-standby-silhouette"></div>
          <div class="pet-standby-badge">未连接</div>
        </div>
        <div class="activity-tray-wrap" id="activity-tray-wrap">
          <button id="activity-tray-toggle" class="activity-tray-toggle" type="button" hidden aria-label="展开/收起活动列表">
            <span class="tray-count"></span>
          </button>
          <div id="activity-tray" class="activity-tray" hidden></div>
        </div>
      </section>

      <!-- 右键菜单（桌宠窗口） -->
      <nav id="pet-context-menu" class="pet-context-menu" aria-label="宠物菜单" hidden>
        <button id="pet-menu-settings" type="button">设置</button>
        <button id="pet-menu-hide" type="button">隐藏</button>
      </nav>

      <!-- 设置窗口内容由 src/settings-app.ts 注入 -->
      <section id="window-content"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
